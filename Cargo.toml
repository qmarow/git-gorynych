[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.0.0-alpha.0"
edition = "2024"
authors = ["ironxenot"]
publish = false

[workspace.dependencies]
gorynych-core = { path = "crates/gorynych-core" }
gorynych-storage = { path = "crates/gorynych-storage" }
gorynych-git = { path = "crates/gorynych-git" }
gorynych-watcher = { path = "crates/gorynych-watcher" }
gorynych-ci-linter = { path = "crates/gorynych-ci-linter" }
gorynych-cicd = { path = "crates/gorynych-cicd" }

aes-gcm = "0.11"
base64 = "0.23"
fluent-bundle = "0.16"
getrandom = "0.4"
interprocess = "2"
keyring = "4"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
rusty-leveldb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Точная версия: её требует tauri-specta 2.0.0-rc.26 (`specta = "=2.0.0-rc.26"`).
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
# Те же версии, что у tauri-specta 2.0.0-rc.26.
specta-serde = "=0.0.13"
specta-typescript = "=0.0.13"
tempfile = "3"
thiserror = "2"
unic-langid = "0.9"
url = "2"
windows-sys = "0.61"
