[package]
name = "gorynych-tauri"
description = "Бинарь Tauri v2"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# Отдельное имя: на Windows у lib и bin с одним именем конфликтуют файлы PDB
name = "gorynych_tauri_lib"
path = "src/lib.rs"

[[bin]]
name = "gorynych-tauri"
path = "src/main.rs"

[features]
# Рабочая сборка: страница из встроенного `dist` по протоколу приложения, без режима разработки Tauri.
# `npm run build && cargo build --release -p gorynych-tauri --features custom-protocol` (`npm run app:build`)
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
gorynych-core.workspace = true
gorynych-storage.workspace = true
gorynych-git.workspace = true
gorynych-watcher.workspace = true
gorynych-ci-linter.workspace = true
gorynych-cicd.workspace = true
async-trait.workspace = true
tokio.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-specta.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-version.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
