<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitKraken Clone</title>
    <style>
      /* Лоадер до запуска React: показывается в первые доли секунды */
      html { background: #0e1117; }
      html, body { margin: 0; height: 100%; }
      .boot { height: 100%; display: flex; align-items: center; justify-content: center; }
      .boot-ring {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.08);
        border-top-color: #3cf0a0; border-right-color: #2f9bff;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><div class="boot-ring"></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
