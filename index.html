<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>git-Горыныч</title>
    <style>
      /* Лоадер до запуска React: показывается в первые доли секунды */
      html { background: #0e1117; }
      html, body { margin: 0; height: 100%; }
      .boot { height: 100%; display: flex; align-items: center; justify-content: center; }
      .boot-ring {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.08);
        border-top-color: #3cf0a0; border-right-color: #2f9bff;
        animation: boot-spin 0.8s linear infinite;
      }
      html[data-scheme='light'] .boot-ring { border-color: rgba(16, 24, 40, 0.1); border-top-color: #0c9a63; border-right-color: #1767d6; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <script>
      // Подложка сразу в цвет сохранённой темы — без тёмной вспышки в светлой теме
      try {
        var a = JSON.parse(localStorage.getItem('appearance') || 'null') || {};
        var t = a.theme === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'kraken') : a.theme;
        var base = { light: '#eceff4' }[t];
        if (base) document.documentElement.style.background = base;
        if (t === 'light') document.documentElement.dataset.scheme = 'light';
      } catch (e) {}
    </script>
    <div id="root"><div class="boot"><div class="boot-ring"></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
